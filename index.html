                        x1: seg.end,
                        y0: 0,
                        y1: 1,
                        fillcolor: c,
                        line: { width: 0 }
                    });
                });
            }
            basePlotShapes = shapes;

            const computedStyle = getComputedStyle(document.documentElement);
            const plotBg = computedStyle.getPropertyValue('--av-plot-bg').trim() || '#0f1013';

            const layout = {
                paper_bgcolor: plotBg,
                plot_bgcolor: plotBg,
                margin: { l: 48, r: 48, t: 8, b: 28 },
                font: { family: "'B612', -apple-system, sans-serif", size: 10, color: '#64748b' },
                hovermode: 'x unified',
                hoverdistance: 30,
                showlegend: false,
                shapes: shapes,
                xaxis: {
                    title: { text: 'MISSION TIME (SEC)', font: { family: "'B612 Mono', monospace", size: 9.5, color: '#475569' } },
                    gridcolor: 'rgba(255, 255, 255, 0.04)',
                    zerolinecolor: 'rgba(255, 255, 255, 0.08)',
                    tickfont: { family: "'B612 Mono', monospace", size: 9.5, color: '#64748b' },
                    rangeslider: { visible: false }
                },
                yaxis: {
                    title: { text: y1Fields.join(', ') || 'Y1 PRIMARY', font: { family: "'B612 Mono', monospace", size: 9.5, color: '#38bdf8' } },
                    gridcolor: 'rgba(255, 255, 255, 0.04)',
                    zerolinecolor: 'rgba(255, 255, 255, 0.08)',
                    tickfont: { family: "'B612 Mono', monospace", size: 9.5, color: '#38bdf8' }
                },
                yaxis2: {
                    title: { text: y2Fields.join(', ') || 'Y2 SECONDARY', font: { family: "'B612 Mono', monospace", size: 9.5, color: '#f59e0b' } },
                    overlaying: 'y',
                    side: 'right',
                    gridcolor: 'rgba(255, 255, 255, 0.02)',
                    tickfont: { family: "'B612 Mono', monospace", size: 9.5, color: '#f59e0b' }
                }
            };

            const config = {
                responsive: true,
                displayModeBar: false,
                doubleClick: 'reset'
            };

            Plotly.react('main-plot', traces, layout, config);
            setupPlotlyEventListeners();
            updateChannelRibbon();
            updateChannelReadouts(currentTimeCursor);
        }

        function getInterpolatedTelemetry(timeSec) {
            if (!currentTrajectory || currentTrajectory.length === 0) return null;
            if (timeSec <= currentTrajectory[0].time) return currentTrajectory[0];
            const last = currentTrajectory[currentTrajectory.length - 1];
            if (timeSec >= last.time) return last;

            // Fast Binary Search for surrounding bracket [idx0, idx1]
            let low = 0, high = currentTrajectory.length - 1;
            while (low <= high) {
                const mid = (low + high) >> 1;
                if (currentTrajectory[mid].time < timeSec) {
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }

            const idx0 = Math.max(0, low - 1);
            const idx1 = Math.min(currentTrajectory.length - 1, low);
            const p0 = currentTrajectory[idx0];
            const p1 = currentTrajectory[idx1];

            if (idx0 === idx1 || p1.time <= p0.time) return p0;

            const alpha = Math.max(0, Math.min(1, (timeSec - p0.time) / (p1.time - p0.time)));

            // Shortest angular path interpolation for heading / yaw (handles 0/360 wrap)
            let dyaw = (p1.yaw - p0.yaw) % 360;
            if (dyaw > 180) dyaw -= 360;
            if (dyaw < -180) dyaw += 360;
            const interpYaw = (p0.yaw + dyaw * alpha + 360) % 360;

            // Guard against interpolating into or out of uninitialized (0, 0) GPS states
            const hasGps0 = Math.abs(p0.lat || 0) > 0.001 && Math.abs(p0.lng || 0) > 0.001;
            const hasGps1 = Math.abs(p1.lat || 0) > 0.001 && Math.abs(p1.lng || 0) > 0.001;
            let interpLat = 0, interpLng = 0, interpAlt = p0.alt || 0;
            if (hasGps0 && hasGps1) {
                interpLat = p0.lat + (p1.lat - p0.lat) * alpha;
                interpLng = p0.lng + (p1.lng - p0.lng) * alpha;
                interpAlt = p0.alt + (p1.alt - p0.alt) * alpha;
            } else if (hasGps1) {
                interpLat = p1.lat;
                interpLng = p1.lng;
                interpAlt = p1.alt;
            } else if (hasGps0) {
                interpLat = p0.lat;
                interpLng = p0.lng;
                interpAlt = p0.alt;
            }

            // Interpolate 8-channel servo outputs / motor PWMs
            let interpServos = [1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000];
            if (p0.servos && p1.servos && p0.servos.length >= 8 && p1.servos.length >= 8) {
                interpServos = p0.servos.map((s0, idx) => {
                    const s1 = p1.servos[idx] !== undefined ? p1.servos[idx] : s0;
                    return Math.round(s0 + (s1 - s0) * alpha);
                });
            } else if (p0.servos) {
                interpServos = p0.servos;
            }

            const p0RelAlt = (typeof p0.rel_alt === 'number') ? p0.rel_alt : ((p0.alt || 0) - (currentFlightData?.metadata?.field_elevation || 0));
            const p1RelAlt = (typeof p1.rel_alt === 'number') ? p1.rel_alt : ((p1.alt || 0) - (currentFlightData?.metadata?.field_elevation || 0));
            const interpRelAlt = p0RelAlt + (p1RelAlt - p0RelAlt) * alpha;

            const p0FieldElev = p0.field_elev || currentFlightData?.metadata?.field_elevation || 0;
            const p1FieldElev = p1.field_elev || currentFlightData?.metadata?.field_elevation || 0;
            const interpFieldElev = p0FieldElev + (p1FieldElev - p0FieldElev) * alpha;

            const p0BaroTemp = (typeof p0.baro_temp === 'number' && Math.abs(p0.baro_temp) > 0.05) ? p0.baro_temp : (p0.temp || 0);
            const p1BaroTemp = (typeof p1.baro_temp === 'number' && Math.abs(p1.baro_temp) > 0.05) ? p1.baro_temp : (p1.temp || 0);
            const interpBaroTemp = p0BaroTemp + (p1BaroTemp - p0BaroTemp) * alpha;

            const p0ArspTemp = (typeof p0.arsp_temp === 'number' && Math.abs(p0.arsp_temp) > 0.05) ? p0.arsp_temp : p0BaroTemp;
            const p1ArspTemp = (typeof p1.arsp_temp === 'number' && Math.abs(p1.arsp_temp) > 0.05) ? p1.arsp_temp : p1BaroTemp;
            const interpArspTemp = p0ArspTemp + (p1ArspTemp - p0ArspTemp) * alpha;

            const interpQnh = (p0.qnh_hpa || 1013.25) + ((p1.qnh_hpa || p0.qnh_hpa || 1013.25) - (p0.qnh_hpa || 1013.25)) * alpha;
            const interpPress = (p0.press_hpa || 1013.25) + ((p1.press_hpa || p0.press_hpa || 1013.25) - (p0.press_hpa || 1013.25)) * alpha;

            return {
                time: timeSec,
                lat: interpLat,
                lng: interpLng,
                alt: interpAlt,
                rel_alt: interpRelAlt,
                field_elev: interpFieldElev,
                arsp_temp: interpArspTemp,
                baro_temp: interpBaroTemp,
                has_arsp: p0.has_arsp || p1.has_arsp || false,
                qnh_hpa: interpQnh,
                press_hpa: interpPress,
                roll: p0.roll + (p1.roll - p0.roll) * alpha,
                pitch: p0.pitch + (p1.pitch - p0.pitch) * alpha,
                yaw: interpYaw,
                tas: p0.tas + (p1.tas - p0.tas) * alpha,
                gs: p0.gs + (p1.gs - p0.gs) * alpha,
                crt: p0.crt + (p1.crt - p0.crt) * alpha,
                power: p0.power + (p1.power - p0.power) * alpha,
                volt: p0.volt + (p1.volt - p0.volt) * alpha,
                curr: p0.curr + (p1.curr - p0.curr) * alpha,
                tho: p0.tho + (p1.tho - p0.tho) * alpha,
                consumed_mah: (p0.consumed_mah || 0) + ((p1.consumed_mah || 0) - (p0.consumed_mah || 0)) * alpha,
                rem_pct: (p0.rem_pct !== undefined && p1.rem_pct !== undefined) ? (p0.rem_pct + (p1.rem_pct - p0.rem_pct) * alpha) : 100,
                wh_km: p0.wh_km + (p1.wh_km - p0.wh_km) * alpha,
                density: (p0.density || 1.18) + ((p1.density || 1.18) - (p0.density || 1.18)) * alpha,
                press: (p0.press || 101325) + ((p1.press || 101325) - (p0.press || 101325)) * alpha,
                temp: (p0.temp || 25) + ((p1.temp || 25) - (p0.temp || 25)) * alpha,
                aoa: (p0.aoa || 0) + ((p1.aoa || 0) - (p0.aoa || 0)) * alpha,
                wind_spd: (p0.wind_spd || 0) + ((p1.wind_spd || 0) - (p0.wind_spd || 0)) * alpha,
                wind_dir: (p0.wind_dir || 0) + ((p1.wind_dir || 0) - (p0.wind_dir || 0)) * alpha,
                mode: alpha < 0.5 ? p0.mode : p1.mode,
                servos: interpServos
            };
        }

        // ---------------------------------------------------------------------------
        // Synchronize 3D Model, Map, and Telemetry HUD on Scrub & Playback
        // ---------------------------------------------------------------------------
        function syncTelemetryAtTime(timeSec, isJump = false) {
            currentTimeCursor = timeSec;
            if (!currentTrajectory || currentTrajectory.length === 0) return;

            const sample = getInterpolatedTelemetry(timeSec);
            if (!sample) return;

            // Update Flight Mode Annunciator (FMA) Panel
            const modeLabel = document.getElementById('mode-label-text');
            const modeLed = document.getElementById('mode-led-dot');
            const modePill = document.getElementById('replay-mode-pill');
            if (sample.mode) {
                if (modeLabel) modeLabel.textContent = sample.mode;
                const modeColor = FLIGHT_MODE_COLORS[sample.mode] || '#30d158';
                if (modeLed) {
                    modeLed.style.backgroundColor = modeColor;
                    modeLed.style.boxShadow = `0 0 6px ${modeColor}`;
                }
                if (modePill) {
                    modePill.style.borderColor = `${modeColor}55`;
                }
            }

            // Update live telemetry readouts on chips and ribbon
            updateChannelReadouts(timeSec);
            updatePlotCursor(timeSec);

            // Update Leaflet Satellite Map Aircraft Position & Heading
            updatePlaneOnMap(sample.lat, sample.lng, sample.yaw);

            // Update 3D Sharkee Model Attitude (if active)
            update3DPlaneAttitude(sample.roll, sample.pitch, sample.yaw, sample.lat, sample.lng, sample.alt);

            // Synchronize SITL Digital Twin Frame (Shark Hawk + PFD Horizon + NAV Compass + Atmosphere Panel)
            const sitlIframe = document.getElementById('sitl-viewer-frame');
            if (sitlIframe && sitlIframe.contentWindow) {
                if (typeof sitlIframe.contentWindow.applyFlightLogTelemetry === 'function') {
                    sitlIframe.contentWindow.applyFlightLogTelemetry(sample, isJump);
                } else {
                    sitlIframe.contentWindow.postMessage({
                        type: 'SYNC_TELEMETRY',
                        telemetry: sample,
                        isJump: isJump
                    }, '*');
                }
            }
        }

        // ---------------------------------------------------------------------------
        // Flight Telemetry Replay Engine (Play / Pause / Scrub / Multiplier)
        // ---------------------------------------------------------------------------
        let isReplaying = false;
        let replaySpeed = 1.0;
        let lastReplayTimestamp = 0;
        let flightMaxTime = 0;
        let basePlotShapes = [];
        let lastCursorRelayout = 0;

        function toggleReplayPlayback() {
            if (!currentTrajectory || currentTrajectory.length === 0) return;
            isReplaying = !isReplaying;
            const btn = document.getElementById('btn-play-pause');
            const icon = document.getElementById('play-icon');
            if (isReplaying) {
                if (btn) btn.classList.add('playing');
                if (icon) icon.textContent = "Pause";
                lastReplayTimestamp = performance.now();
                requestAnimationFrame(replayAnimationLoop);
            } else {
                if (btn) btn.classList.remove('playing');
                if (icon) icon.textContent = "Play";
            }
        }

        function stepReplayTime(deltaSec) {
            if (!flightMaxTime) return;
            currentTimeCursor = Math.max(0, Math.min(flightMaxTime, currentTimeCursor + deltaSec));
            updateReplayScrubberUI(currentTimeCursor);
            syncTelemetryAtTime(currentTimeCursor, true);
        }

        function onScrubberInput(valPercent) {
            if (!flightMaxTime) return;
            const t = (parseFloat(valPercent) / 100.0) * flightMaxTime;
            currentTimeCursor = t;
            updateReplayScrubberUI(currentTimeCursor);
            syncTelemetryAtTime(currentTimeCursor, true);
        }

        function onReplaySpeedChange(spd) {
            replaySpeed = parseFloat(spd) || 1.0;
        }

        function replayAnimationLoop(now) {
            if (!isReplaying) return;
            const dtSec = Math.min((now - lastReplayTimestamp) / 1000.0, 0.05);
            lastReplayTimestamp = now;

            if (flightMaxTime > 0) {
                currentTimeCursor += dtSec * replaySpeed;
                if (currentTimeCursor > flightMaxTime) {
                    currentTimeCursor = 0;
                }
                updateReplayScrubberUI(currentTimeCursor);
                syncTelemetryAtTime(currentTimeCursor, false);
            }

            requestAnimationFrame(replayAnimationLoop);
        }

        function formatFlightClock(sec) {
            const m = Math.floor(sec / 60);
            const s = (sec % 60).toFixed(1);
            return `${m.toString().padStart(2, '0')}:${s.padStart(4, '0')}`;
        }

        function updateReplayScrubberUI(curT) {
            const scrubber = document.getElementById('replay-scrubber');
            const playhead = document.getElementById('timeline-playhead');
            const timeTxt = document.getElementById('replay-time-text');
            if (flightMaxTime > 0) {
                const pct = Math.max(0, Math.min(100, (curT / flightMaxTime) * 100.0));
                if (scrubber && document.activeElement !== scrubber) {
                    scrubber.value = pct.toFixed(1);
                }
                if (playhead) {
                    playhead.style.left = `${pct}%`;
                }
                if (timeTxt) {
                    timeTxt.textContent = `${formatFlightClock(curT)} / ${formatFlightClock(flightMaxTime)}`;
                }
            }
            if (isPlotVisible) {
                updatePlotCursor(curT);
            }
        }

        function updatePlotCursor(t) {
            const cursor = document.getElementById('plot-cursor-line');
            const badge = document.getElementById('plot-cursor-badge');
            const plotEl = document.getElementById('main-plot');
            if (!cursor || !plotEl || !plotEl._fullLayout || !plotEl._fullLayout.xaxis) return;

            const xa = plotEl._fullLayout.xaxis;
            const ya = plotEl._fullLayout.yaxis;
            if (!xa || !ya || !xa.range) return;

            const minX = Math.min(xa.range[0], xa.range[1]);
            const maxX = Math.max(xa.range[0], xa.range[1]);
            if (t < minX || t > maxX) {
                cursor.style.display = 'none';
                return;
            }

            const xPx = xa.d2p(t) + xa._offset;
            const topPx = ya._offset;
            const heightPx = ya._length;

            const ribbonEl = document.getElementById('plot-channel-ribbon');
            const ribbonOffset = ribbonEl ? ribbonEl.offsetHeight : 26;

            cursor.style.left = `${xPx}px`;
            cursor.style.top = `${ribbonOffset + topPx}px`;
            cursor.style.height = `${heightPx}px`;
            cursor.style.display = 'block';

            if (badge) {
                const sample = getInterpolatedTelemetry(t); const modeStr = sample && sample.mode ? ` · ${sample.mode}` : ''; badge.textContent = `T = ${formatFlightClock(t)}${modeStr}`;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                toggleReplayPlayback();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                stepReplayTime(-2);
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                stepReplayTime(2);
            }
        });

        // ---------------------------------------------------------------------------
        // Three.js 3D Sharkee Aircraft Model & Trajectory Engine
        // ---------------------------------------------------------------------------
        let scene, camera, renderer, controls;
        let sharkeeModelGroup, trajectoryLine;
        let followCamera = true;

        function initThreeJS() {
            const container = document.getElementById('three-canvas-container');
            const w = container.clientWidth || 400;
            const h = container.clientHeight || 200;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080e18);

            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 20000);
            camera.position.set(2.5, 1.8, 3.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            const grid = new THREE.GridHelper(500, 50, 0x00d2ff, 0x1e293b);
            grid.position.y = -2;
            scene.add(grid);

            sharkeeModelGroup = new THREE.Group();
            scene.add(sharkeeModelGroup);

            loadSharkeeCAD();

            window.addEventListener('resize', onWindowResize);
            animateThree();
        }

        function loadSharkeeCAD() {
            const loader = new THREE.GLTFLoader();
            loader.load('models/Sharkee.glb', (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.001, 0.001, 0.001);
                model.rotation.set(0, THREE.MathUtils.degToRad(90), THREE.MathUtils.degToRad(180));
                sharkeeModelGroup.add(model);
            }, undefined, (err) => {
                const bodyGeo = new THREE.ConeGeometry(0.3, 2.0, 8);
                bodyGeo.rotateX(Math.PI / 2);
                const wingGeo = new THREE.BoxGeometry(3.0, 0.04, 0.5);
                const mat = new THREE.MeshPhongMaterial({ color: 0x00d2ff });
                const planeMesh = new THREE.Group();
                planeMesh.add(new THREE.Mesh(bodyGeo, mat));
                planeMesh.add(new THREE.Mesh(wingGeo, mat));
                sharkeeModelGroup.add(planeMesh);
            });
        }

        function load3DTrajectory(trajectory) {
            if (trajectoryLine) scene.remove(trajectoryLine);
            if (!trajectory || trajectory.length === 0) return;

            const points = [];
            const refLat = trajectory[0].lat;
            const refLng = trajectory[0].lng;
            const refAlt = trajectory[0].alt;

            trajectory.forEach(pt => {
                if (pt.lat !== 0 && pt.lng !== 0) {
                    const x = (pt.lng - refLng) * 111320 * Math.cos(refLat * Math.PI / 180);
                    const z = (refLat - pt.lat) * 110540;
                    const y = (pt.alt - refAlt) * 0.2;
                    points.push(new THREE.Vector3(x * 0.05, y, z * 0.05));
                }
            });

            if (points.length > 1) {
                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({ color: 0x30d158, linewidth: 2 });
                trajectoryLine = new THREE.Line(geom, mat);
                scene.add(trajectoryLine);
            }
        }

        function update3DPlaneAttitude(rollDeg, pitchDeg, yawDeg) {
            if (!sharkeeModelGroup) return;
            const r = THREE.MathUtils.degToRad(rollDeg);
            const p = THREE.MathUtils.degToRad(pitchDeg);
            const y = THREE.MathUtils.degToRad(-yawDeg);

            sharkeeModelGroup.rotation.set(p, y, -r);

            if (followCamera) {
                camera.position.x = sharkeeModelGroup.position.x + 2.5;
                camera.position.y = sharkeeModelGroup.position.y + 1.8;
                camera.position.z = sharkeeModelGroup.position.z + 3.5;
                controls.target.copy(sharkeeModelGroup.position);
            }
        }

        function toggleCameraMode() {
            followCamera = !followCamera;
            document.getElementById('btn-follow').textContent = followCamera ? "Follow Plane" : "Free Camera";
        }

        function reset3DCamera() {
            camera.position.set(2.5, 1.8, 3.5);
            controls.target.set(0, 0, 0);
            followCamera = true;
            document.getElementById('btn-follow').textContent = "Follow Plane";
        }

        function onWindowResize() {
            const container = document.getElementById('three-canvas-container');
            if (!container || !renderer) return;
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animateThree() {
            requestAnimationFrame(animateThree);
            const threePane = document.getElementById('three-hud-pane');
            if (!threePane || threePane.style.display === 'none' || !renderer || !scene || !camera) return;
            controls.update();
            renderer.render(scene, camera);
        }

        // ---------------------------------------------------------------------------
        // Segment Extraction & Results Table
        // ---------------------------------------------------------------------------
        function populateSegmentSelectors(modeSegs, speedSteps) {
            const modeSel = document.getElementById('mode-segment-select');
            modeSel.innerHTML = '<option value="">Select Flight Mode Segment...</option>';
            if (modeSegs) {
                modeSegs.forEach(seg => {
                    const opt = document.createElement('option');
                    opt.value = `${seg.start},${seg.end}`;
                    opt.textContent = `Mode ${seg.mode}: ${seg.start}s - ${seg.end}s (${seg.dur}s)`;
                    modeSel.appendChild(opt);
                });
            }

            const stepSel = document.getElementById('step-segment-select');
            stepSel.innerHTML = '<option value="">Select Airspeed Test Step (AUTO)...</option>';
            if (speedSteps) {
                speedSteps.forEach(step => {
                    const opt = document.createElement('option');
                    opt.value = `${step.start},${step.end}`;
                    opt.textContent = `Target ${step.target_eas} m/s: ${step.start}s - ${step.end}s (${step.dur}s)`;
                    stepSel.appendChild(opt);
                });
            }
        }

        function onSegmentSelect(val) {
            if (!val) return;
            const [t0, t1] = val.split(',').map(Number);
            zoomPlotToRange(t0, t1);
            syncTelemetryAtTime((t0 + t1) / 2);
        }

        function onStepSelect(val) {
            if (!val) return;
            const [t0, t1] = val.split(',').map(Number);
            zoomPlotToRange(t0, t1);
            syncTelemetryAtTime((t0 + t1) / 2);
        }

        function zoomPlotToRange(t0, t1) {
            Plotly.relayout('main-plot', {
                'xaxis.range': [t0, t1]
            });
        }

        async function addCurrentSegmentToTable() {
            if (!currentFlightData) return;
            const plotEl = document.getElementById('main-plot');
            let t0 = 0, t1 = currentFlightData.metadata.duration_s;
            if (plotEl && plotEl.layout && plotEl.layout.xaxis && plotEl.layout.xaxis.range) {
                t0 = plotEl.layout.xaxis.range[0];
                t1 = plotEl.layout.xaxis.range[1];
            }

            try {
                const res = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: currentFlightData.metadata.path,
                        start: t0,
                        end: t1,
                        weight: 5.1,
                        wing_area: 0.45
                    })
                });
                const data = await res.json();
                if (data.success && data.metrics) {
                    testTableRows.push(data.metrics);
                    updateResultsTableUI();
                    alert(`Added test point: TAS ${data.metrics.tas} m/s | Power ${data.metrics.power} W | Wh/km ${data.metrics.wh_km_air}`);
                }
            } catch (e) {
                console.error("Failed to compute regime metrics:", e);
            }
        }

        function updateResultsTableUI() {
            document.getElementById('table-row-count').textContent = testTableRows.length;
            const tbody = document.getElementById('results-tbody');
            if (testTableRows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="padding:14px; text-align:center; color:#64748b;">No test segments added yet.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            testTableRows.sort((a,b) => a.tas - b.tas);

            testTableRows.forEach(r => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid #1e293b';
                tr.innerHTML = `
                    <td style="padding:6px; color:#00d2ff; font-weight:bold;">${r.tas}</td>
                    <td style="padding:6px;">${r.gs}</td>
                    <td style="padding:6px; color:#f97316;">${r.throttle}%</td>
                    <td style="padding:6px; color:#a855f7; font-weight:bold;">${r.power}</td>
                    <td style="padding:6px; color:#22c55e;">${r.wh_km_air}</td>
                    <td style="padding:6px;">${r.aoa}</td>
                    <td style="padding:6px; color:#c084fc;">${r.cl}</td>
                    <td style="padding:6px;">${r.density}</td>
                    <td style="padding:6px;">${r.wind_spd} m/s @ ${r.wind_dir}°</td>
                    <td style="padding:6px; font-weight:bold;">${r.mode}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportResultsCSV() {
            if (testTableRows.length === 0) {
                alert("Test table is empty.");
                return;
            }
            const keys = Object.keys(testTableRows[0]);
            let csv = keys.join(',') + '\n';
            testTableRows.forEach(r => {
                csv += keys.map(k => r[k]).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Sharkee_Flight_Test_Results_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function clearResultsTable() {
            testTableRows = [];
            updateResultsTableUI();
        }

        function openExpressionModal() { document.getElementById('expression-modal').style.display = 'flex'; }
        function closeExpressionModal() { document.getElementById('expression-modal').style.display = 'none'; }
        function openTestTableModal() { document.getElementById('table-modal').style.display = 'flex'; }
        function closeTestTableModal() { document.getElementById('table-modal').style.display = 'none'; }

        function addCustomExpression() {
            const expr = document.getElementById('custom-expr-input').value.trim();
            if (expr) {
                addFieldToPlot(`Expr: ${expr}`, 0);
                closeExpressionModal();
            }
        }
    </script>
</body>
